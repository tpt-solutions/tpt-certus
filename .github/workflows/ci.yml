name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TELOS_VERSION: 0.2.0

jobs:
  build-and-test:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  telos-verify-gate:
    name: telos verify (all .telos sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install telos CLI (pinned)
        run: cargo install tpt-telos --version ${{ env.TELOS_VERSION }} --locked

      - name: Verify every .telos source
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            echo "== telos verify $file"
            telos verify "$file"
            count=$((count + 1))
          done < <(find . -name '*.telos' -type f ! -path './target/*')
          echo "verified $count .telos file(s)"
          if [ "$count" -eq 0 ]; then
            echo "note: no .telos sources yet (Phase 1 will add them); gate is a no-op"
          fi

      - name: telos build + verify-manifest (native integrity gate)
        run: |
          set -euo pipefail
          # Phase 1.4: round-trip the compiler's own hash-sealed proof manifest
          # (telos-proof.json) against its source for every contract the codegen
          # path can actually build.
          #
          # Note: `crates/tpt-certus-spatial/telos/ray_aabb.telos` is currently
          # EXCLUDED: v0.2.0 codegen drops invariant-only struct fields and
          # demotes Float64 params (Phase 1.2 finding), so `telos build` on it
          # emits non-compiling Rust.  That contract rejoins this gate once the
          # codegen is contract-faithful.
          blocks=0
          while IFS= read -r file; do
            case "$file" in
              crates/tpt-certus-spatial/telos/ray_aabb.telos) continue ;; esac
            echo "== telos build $file"
            outdir="$(mktemp -d)"
            telos build "$file" --out-dir "$outdir"
            echo "== telos verify-manifest $outdir/telos-proof.json $file"
            telos verify-manifest "$outdir/telos-proof.json" "$file"
            rm -rf "$outdir"
            blocks=$((blocks + 1))
          done < <(find . -name '*.telos' -type f ! -path './target/*')
          echo "verified manifests for $blocks buildable .telos file(s)"
          if [ "$blocks" -eq 0 ]; then
            echo "note: no buildable .telos sources yet; native integrity gate is a no-op"
          fi